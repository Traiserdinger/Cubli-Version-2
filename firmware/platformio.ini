; CubliV2 firmware — PlatformIO project
;
;   pio run                    build the ESP32 firmware
;   pio run -t upload          flash over USB-C (CH340C auto-reset)
;   pio device monitor         CLI + telemetry (921600 baud, DTR/RTS released)
;   pio test -e native         unit tests and closed-loop simulation on the PC
;
; Layout: hardware-independent code lives in lib/ (built by both environments);
; ESP-IDF code lives in src/. The esp32 environment compiles lib/ through
; src/CMakeLists.txt so that one warning policy (-Werror) covers everything.

[platformio]
default_envs = esp32

[env:esp32]
; Pinned: espressif32 6.13.0 ships ESP-IDF 5.5.3. Later platform releases move
; to ESP-IDF 6.x, which this code has not been validated against.
platform = espressif32@6.13.0
board = esp32dev
framework = espidf
board_build.partitions = partitions.csv
board_build.flash_size = 4MB
monitor_speed = 921600
; The auto-reset circuit maps DTR/RTS onto EN/IO0: keep both released so the
; monitor does not reset the board or press the BOOT (user) button.
monitor_dtr = 0
monitor_rts = 0
monitor_filters = direct
upload_speed = 921600
lib_ldf_mode = off
lib_ignore = core, estimation, control, logic
test_ignore = *

[env:native]
platform = native
test_framework = unity
build_flags =
    -std=c++17
    -Wall
    -Wextra
    -Werror
    -Wshadow
    -Wdouble-promotion
    -DCUBLI_NATIVE=1
lib_ldf_mode = deep+
test_build_src = no
